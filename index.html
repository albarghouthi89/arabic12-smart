    .tk-foot{position:absolute;inset-inline:0;bottom:calc(22px + env(safe-area-inset-bottom));font-size:.82rem;opacity:.7;animation:tk-fade .6s ease 1.2s both}

    @keyframes tk-draw{to{stroke-dashoffset:0}}
    @keyframes tk-dotpop{to{transform:scale(1)}}
    @keyframes tk-fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
    @keyframes tk-load{to{transform:scaleX(1)}}
    @media (prefers-reduced-motion:reduce){#tk-splash,.tk-logo,.tk-line,.tk-dot,.tk-name,.tk-tag,.tk-bar,.tk-bar i,.tk-foot{animation:none!important;transition:none!important}
      .tk-line{stroke-dashoffset:0}.tk-dot{transform:none}.tk-bar i{transform:none}}
  </style>
