<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>نظام الطالب الذكي — اللغة العربية 12 علمي</title>
  <meta name="description" content="نظام تعلم تفاعلي — اللغة العربية، الصف الثاني عشر العلمي، قطر — إعداد المعلم عبدالله البرغوثي" />
  <!-- ملاحظة مُحدَّثة (المرحلة الثانية — الإطلاق التجاري): أدوات التعلّم والتدريب
       الأساسية (الدروس، بنك الأسئلة، مختبر الأخطاء...) تعمل بالكامل دون اتصال
       كما كانت دائمًا. الإضافة الوحيدة التي تحتاج إنترنت هي طبقة الحسابات
       الحقيقية/التجربة المجانية/الاشتراك (js/platform/*) — وهي طبقة إضافية
       بحتة: إن تعذّر الاتصال بها لأي سبب تستمر بقية المنصة في العمل محليًا
       دون أي خطأ يوقف الصفحة. -->
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/platform.css" />
</head>
<body>

  <header class="app-header">
    <button id="back-btn" class="icon-btn hidden" aria-label="رجوع" title="رجوع"><svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M14 6L8 12L14 18" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <h2 id="header-title">نظام الطالب الذكي</h2>
    <span id="streak-chip" class="chip">🔥 0 يوم</span>
    <span id="xp-chip" class="chip">⭐ 0 XP</span>
  </header>

  <main id="app-main" role="main" aria-live="polite"></main>

  <!-- ==================== طبقة الحسابات الحقيقية (إضافة جديدة — المرحلة الثانية) ====================
       تُحمَّل أولًا وقبل كل شيء آخر لأن app.js في نهاية الصفحة يتحقق من
       window.PlatformBoot عند الإقلاع. مكتبة supabase-js من CDN عامة وموثوقة
       (jsdelivr)؛ إن تعذّر تحميلها (لا إنترنت) يبقى window.PLATFORM_DB = null
       وتستمر كل الملفات أدناه بالعمل بوضعها المحلي الأصلي دون أي تغيير.
       config.js يحتوي فقط على Project URL + Anon/Publishable Key — قيمتان
       آمنتان تمامًا للنشر العلني (راجع التعليق داخل الملف). لا يوجد ولن
       يوضع أبدًا أي مفتاح service_role في أي ملف يصل إليه المتصفح.
  =============================================================================================== -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="js/platform/config.js"></script>
  <script src="js/platform/supabase-client.js"></script>
  <script src="js/platform/auth.js"></script>
  <script src="js/platform/access.js"></script>

  <!-- ==================== ترتيب تحميل السكربتات مهم ====================
       1) data-core.js يهيّئ ARABIC12_DATA فارغة
       2) كل ملف في js/lessons/ يضيف درسًا واحدًا (بترتيب أسابيع الفصل)
       3) بقية المحركات، ثم app.js أخيرًا
  ==================================================================== -->
  <script src="js/data-core.js"></script>
  <script src="js/lessons/01-tashbih-istiara.js"></script>
  <script src="js/lessons/02-noor-ala-noor.js"></script>
  <script src="js/lessons/03-khitab-ameer.js"></script>
  <script src="js/lessons/04-afaal-muqaraba.js"></script>
  <script src="js/lessons/05-maqal-niqashi.js"></script>
  <script src="js/lessons/06-madrasat-ihya.js"></script>
  <script src="js/lessons/07-ghurba-hanin.js"></script>
  <script src="js/lessons/08-maqal-tafsiri.js"></script>
  <script src="js/lessons/09-madrasa-romansiya.js"></script>
  <script src="js/lessons/10-khubz-murr.js"></script>
  <script src="js/lessons/11-shart-jazima.js"></script>
  <script src="js/lessons/12-sada-hayat.js"></script>
  <script src="js/lessons/13-shart-ghayr-jazima.js"></script>
  <script src="js/progress.js"></script>

  <!-- مزامنة التقدّم المحلي مع قاعدة البيانات الحقيقية (إضافة جديدة — المرحلة
       الثانية) — تُغلِّف دوال Progress دون تعديل js/progress.js نفسه إطلاقًا.
       يجب أن تُحمَّل بعد js/progress.js مباشرة. -->
  <script src="js/platform/progress-sync.js"></script>

  <script src="js/quiz.js"></script>
  <script src="js/mindmap.js"></script>

  <!-- ==================== بنك الأسئلة التجريبية والوزارية (إضافة جديدة) ====================
       يُحمَّل بعد كل المحركات الحالية وقبل app.js حتى يستطيع app.js تسجيل
       مسارات بنك الأسئلة الجديدة في VIEWS دون أي تعديل في بقية الملفات أعلاه.
       questions-bank-data-raw.js اختياري (للتتبع والتدقيق فقط)؛ لا شيء في
       الواجهة يعتمد عليه بشكل أساسي.
  ======================================================================================= -->
  <script src="js/questions-bank-data.js"></script>
  <script src="js/questions-bank-data-raw.js"></script>
  <script src="js/questions-bank.js"></script>
  <script src="js/questions-bank-ui.js"></script>

  <!-- ==================== طبقة تدقيق الأسئلة الذكي (إضافة جديدة — وضع المعلم فقط) ====================
       تحليل مستقل لجودة الأسئلة يُشغَّل يدويًا من وضع المعلم فقط (لا تلقائيًا عند دخول الطلاب).
       question-audit.js لا يُعدّل أي سؤال أبدًا — فقط يُصنّف ويحفظ نتيجة التصنيف محليًا.
  =========================================================================================== -->
  <script src="js/question-audit.js"></script>
  <script src="js/question-audit-ui.js"></script>

  <!-- ==================== واجهة الحساب/التجربة/الاشتراك + بوابة الدخول (إضافة جديدة — المرحلة الثانية) ====================
       يجب أن تُحمَّل قبل app.js لأن app.js يتحقق من وجودهما فورًا عند الإقلاع
       (لتسجيل مسار "حسابي" في VIEWS، وللمرور عبر بوابة الدخول قبل لوحة التحكم).
       بدون Supabase مُفعَّل، كل شيء هنا خامل تمامًا ولا يظهر أي أثر له.
  ================================================================================================================== -->
  <script src="js/platform/platform-ui.js"></script>
  <script src="js/platform/auth-gate.js"></script>

  <script src="js/app.js"></script>
</body>
</html>
