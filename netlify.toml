# ============================================================================
# netlify.toml — النشر التلقائي على Netlify من GitHub (الفرع main).
#
# يُنشر مجلد dist فقط: نسخة من ملفات الموقع بدون الملفات الداخلية التي لا يجوز
# أن تكون عامة: backend/ (ملفات قاعدة البيانات SQL) و docs/ و .git وهذا الملف.
# لا توجد خطوة بناء أخرى؛ الموقع ملفات ثابتة كما هي.
# ============================================================================
[build]
  publish = "dist"
  command = "rm -rf dist && mkdir dist && tar --exclude=./dist --exclude=./backend --exclude=./docs --exclude=./.git --exclude=./netlify.toml -cf - . | tar -xf - -C dist"
